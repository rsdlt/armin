<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 58 164 96" width="164" height="96" role="img" aria-label="armin: the Long-Range Scouting Formation, the head of it in green and a wing in red">
  <title>armin</title>

  <!-- Relay lines between the units, how word travels along the formation. -->
  <g fill="none" stroke="#8a7650" stroke-width="1.3" stroke-dasharray="2 3">
    <path d="M 34 112 L 50 94 L 72 80 L 100 74 L 128 80 L 150 94 L 166 112"/>
    <path d="M 66 118 L 82 106 L 100 102 L 118 106 L 134 118"/>
    <path d="M 100 74 L 100 140"/>
  </g>

  <!-- The formation: a wide fan of scouts, a second line behind, and the
       command column in the middle. -->
  <g fill="#2f6b3f" stroke="#f4ead0" stroke-width="2">
    <circle cx="34" cy="112" r="5.5"/>
    <circle cx="50" cy="94" r="5.5"/>
    <circle cx="72" cy="80" r="5.5"/>
    <circle cx="128" cy="80" r="5.5"/>
    <circle cx="150" cy="94" r="5.5"/>
    <circle cx="66" cy="118" r="5"/>
    <circle cx="82" cy="106" r="5"/>
    <circle cx="118" cy="106" r="5"/>
    <circle cx="134" cy="118" r="5"/>
    <circle cx="100" cy="122" r="5"/>
    <circle cx="100" cy="140" r="5"/>
  </g>
  <!-- The head of the formation in green, a wing in red, and the commander
       behind the head. -->
  <circle cx="100" cy="74" r="7" fill="#3fae5a" stroke="#f4ead0" stroke-width="2"/>
  <circle cx="166" cy="112" r="5.5" fill="#d9483b" stroke="#f4ead0" stroke-width="2"/>
  <path d="M 100 95 L 107 102 L 100 109 L 93 102 Z" fill="#2f6b3f" stroke="#f4ead0" stroke-width="2" stroke-linejoin="round"/>
</svg>
