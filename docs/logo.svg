<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="armin: the Long-Range Scouting Formation on a map, a green flare marking the route ahead">
  <title>armin</title>
  <defs>
    <linearGradient id="parchment" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f4ead0"/>
      <stop offset="1" stop-color="#e2d2a8"/>
    </linearGradient>
    <linearGradient id="smoke-green" x1="0" x2="0" y1="1" y2="0">
      <stop offset="0" stop-color="#3fae5a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3fae5a" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="smoke-red" x1="0" x2="0" y1="1" y2="0">
      <stop offset="0" stop-color="#d9483b" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d9483b" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- The map. -->
  <rect x="8" y="8" width="184" height="184" rx="12" fill="url(#parchment)" stroke="#6e5a36" stroke-width="3"/>
  <rect x="15" y="15" width="170" height="170" rx="8" fill="none" stroke="#b49a68" stroke-width="1.2" stroke-dasharray="2 3"/>

  <!-- Terrain: contour lines of the land beyond the Wall. -->
  <g fill="none" stroke="#c9b48a" stroke-width="1.4" stroke-linecap="round">
    <path d="M 22 60 C 40 50, 52 64, 70 56"/>
    <path d="M 132 40 C 146 30, 160 44, 176 36"/>
    <path d="M 140 52 C 152 46, 164 56, 174 50"/>
    <path d="M 24 128 C 34 122, 44 132, 54 126"/>
    <path d="M 150 132 C 160 126, 170 136, 178 130"/>
  </g>

  <!-- The Wall the scouts ride out from. -->
  <path d="M 15 170 Q 100 146 185 170" fill="none" stroke="#6e5a36" stroke-width="7" stroke-linecap="round"/>
  <path d="M 15 170 Q 100 146 185 170" fill="none" stroke="#a88d5c" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>

  <!-- Relay lines between the units, how word travels along the formation. -->
  <g fill="none" stroke="#8a7650" stroke-width="1.3" stroke-dasharray="2 3">
    <path d="M 34 112 L 50 94 L 72 80 L 100 74 L 128 80 L 150 94 L 166 112"/>
    <path d="M 66 118 L 82 106 L 100 102 L 118 106 L 134 118"/>
    <path d="M 100 74 L 100 140"/>
  </g>

  <!-- Smoke signals: red on the right wing for danger, green at the head for
       the new heading. -->
  <path d="M 166 106 C 160 96, 172 88, 166 78 S 170 62, 164 54" fill="none" stroke="url(#smoke-red)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 100 72 C 94 62, 106 54, 98 44 S 92 30, 84 26" fill="none" stroke="url(#smoke-green)" stroke-width="8" stroke-linecap="round"/>

  <!-- The route the flare calls: from the head of the formation to the goal. -->
  <path d="M 100 74 C 86 64, 70 52, 52 38" fill="none" stroke="#22b8cf" stroke-width="3.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <circle cx="46" cy="33" r="9" fill="#22b8cf" stroke="#0e5f6b" stroke-width="2.5"/>
  <circle cx="46" cy="33" r="3" fill="#0e5f6b"/>

  <!-- The formation: a wide fan of scouts, a second line behind, and the
       command column in the middle. -->
  <g fill="#2f6b3f" stroke="#f4ead0" stroke-width="2">
    <circle cx="34" cy="112" r="5.5"/>
    <circle cx="50" cy="94" r="5.5"/>
    <circle cx="72" cy="80" r="5.5"/>
    <circle cx="128" cy="80" r="5.5"/>
    <circle cx="150" cy="94" r="5.5"/>
    <circle cx="166" cy="112" r="5.5"/>
    <circle cx="66" cy="118" r="5"/>
    <circle cx="82" cy="106" r="5"/>
    <circle cx="118" cy="106" r="5"/>
    <circle cx="134" cy="118" r="5"/>
    <circle cx="100" cy="122" r="5"/>
    <circle cx="100" cy="140" r="5"/>
  </g>
  <!-- The head of the formation, and the commander behind it. -->
  <circle cx="100" cy="74" r="7" fill="#2f6b3f" stroke="#22b8cf" stroke-width="2.5"/>
  <path d="M 100 95 L 107 102 L 100 109 L 93 102 Z" fill="#2f6b3f" stroke="#f4ead0" stroke-width="2" stroke-linejoin="round"/>
</svg>
