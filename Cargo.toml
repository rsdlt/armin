[package]
name = "armin"
version = "0.1.0"
edition = "2024"
description = "Autocomplete for zsh: a menu of your likeliest commands as you type, ranked from your history"
license = "MIT"
rust-version = "1.88"
readme = "README.md"
# What the crate ships: the code, its tests and the docs crates.io shows. A list
# of what goes in, so a stray file in the working tree never ends up published.
include = [
    "/src/**/*.rs",
    "/src/init.zsh",
    "/tests/**/*.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]
repository = "https://github.com/rsdlt/armin"
keywords = ["zsh", "autocomplete", "history", "shell", "terminal"]
categories = ["command-line-utilities"]

# `cargo binstall armin` downloads the archives the release workflow builds.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/armin-{ version }-{ target }{ archive-suffix }"
bin-dir = "armin-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1.0.104"
nucleo-matcher = "0.3.1"

[dev-dependencies]
tempfile = "3.27.0"
