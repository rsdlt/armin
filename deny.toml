# Supply-chain checks: `cargo deny check`. Run it after every dependency upgrade.

[licenses]
# Every license here is open source and compatible with shipping armin under MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # nucleo-matcher. File-level copyleft: fine to depend on unmodified; changes
    # to its own files would have to be published under MPL.
    "MPL-2.0",
    # unicode-ident, under serde's derive macros: the Unicode data tables'
    # permissive license.
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
